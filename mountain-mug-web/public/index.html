<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Mountain Mug</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4efe7;color:#2c211b}.wrap{max-width:760px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:24px}.head{padding:18px 0}.head h1{margin:0;font-family:Georgia,serif;font-size:34px}.head p{margin:6px 0 0;color:#6c5b50}.chat{background:#fff;border:1px solid #ded4c8;border-radius:22px;box-shadow:0 12px 40px #3b2c1e18;display:flex;flex-direction:column;flex:1;min-height:560px;overflow:hidden}.msgs{padding:22px;overflow:auto;flex:1}.msg{max-width:82%;padding:12px 15px;border-radius:17px;margin:10px 0;line-height:1.4;white-space:pre-wrap}.bot{background:#f1ece5;border-bottom-left-radius:5px}.user{background:#2f4a3c;color:white;margin-left:auto;border-bottom-right-radius:5px}.chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 22px 14px}.chip{border:1px solid #cdbfaf;background:#fff;border-radius:999px;padding:8px 11px;cursor:pointer}.form{display:flex;gap:10px;padding:16px;border-top:1px solid #e6ddd3}.form input{flex:1;border:1px solid #cdbfaf;border-radius:14px;padding:13px;font-size:16px;outline:none}.form button{border:0;border-radius:14px;padding:0 20px;background:#2f4a3c;color:#fff;font-weight:700;cursor:pointer}.form button:disabled{opacity:.55}.note{text-align:center;font-size:12px;color:#806f64;padding:10px} @media(max-width:600px){.wrap{padding:12px}.chat{min-height:calc(100vh - 120px)}.head h1{font-size:28px}.msg{max-width:90%}}
</style></head><body><main class="wrap"><header class="head"><h1>☕ The Mountain Mug</h1><p>Library Bazaar · Mussoorie</p></header><section class="chat"><div class="msgs" id="msgs"><div class="msg bot">Hi! I’m The Mountain Mug assistant. Ask me about our menu, prices, timings, allergens, location or parking.</div></div><div class="chips"><button class="chip">Are you open Sunday morning?</button><button class="chip">What can I get under ₹300?</button><button class="chip">Any dairy-free coffee?</button></div><form class="form" id="form"><input id="input" autocomplete="off" placeholder="Ask The Mountain Mug…" maxlength="3000"><button id="send">Send</button></form></section><div class="note">For severe allergies, always confirm ingredients and cross-contamination risk with café staff.</div></main><script>
const msgs=document.getElementById('msgs'),form=document.getElementById('form'),input=document.getElementById('input'),send=document.getElementById('send');const history=[];
function add(role,text){const d=document.createElement('div');d.className='msg '+(role==='user'?'user':'bot');d.textContent=text;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight}
async function ask(text){if(!text.trim()||send.disabled)return;add('user',text);history.push({role:'user',content:text});input.value='';send.disabled=true;try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});const j=await r.json();const reply=j.reply||j.error||'Sorry, I could not answer that right now.';add('assistant',reply);if(j.reply)history.push({role:'assistant',content:reply})}catch(e){add('assistant','I cannot reach the café assistant right now. Please try again.')}finally{send.disabled=false;input.focus()}}
form.addEventListener('submit',e=>{e.preventDefault();ask(input.value)});document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>ask(b.textContent));
</script></body></html>
